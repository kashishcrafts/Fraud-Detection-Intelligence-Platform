services:
  postgres:
    image: postgres:17
    container_name: fraud_postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  fastapi:
      build: .
      container_name: fraud_fastapi

      depends_on:
        - postgres
      ports:
        - "8000:8000"

  streamlit:
      build:
        context: .
        dockerfile: Dockerfile.streamlit

      container_name: fraud_streamlit

      depends_on:
        - fastapi

      ports:
        - "8501:8501"

volumes:
  postgres_data: